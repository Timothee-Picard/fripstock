name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une branche poussée plusieurs fois d'affilée n'empile pas les runs : seul le
# dernier survit. Sur `main`, en revanche, rien n'est annulé — un run y déploie
# le staging, et l'interrompre à mi-chemin laisserait un déploiement en cours
# sans personne pour en lire l'issue. Les runs de `main` se mettent donc en file.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Vérifications et démarrage de la stack vivent dans un workflow à part, que
  # `release.yml` appelle aussi : le chemin qui déploie en production rejoue
  # ainsi exactement ce que rejoue celui de `main`.
  checks:
    name: Contrôles
    uses: ./.github/workflows/checks.yml

  commits:
    name: Convention de commit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Rattrape les commits poussés avec --no-verify, que le hook local a
      # laissés passer. Même cible que `make check-commits` en local.
      - name: Convention sur la plage de la PR
        run: |
          make check-commits \
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  # Coolify ne se déclenche plus lui-même : son auto-deploy est coupé, et c'est
  # ce job qui le déclenche — après les contrôles, jamais avant. Sur une PR il
  # n'existe pas : `needs` ne suffirait pas, un fork n'a de toute façon pas accès
  # aux secrets.
  deploy-staging:
    name: Déployer le staging
    runs-on: ubuntu-latest
    needs: [checks]
    if: github.event_name == 'push'
    environment:
      name: staging
    # Deux merges rapprochés ne se marchent pas dessus, et surtout aucun n'est
    # annulé : couper un déploiement en cours est pire que d'en attendre un.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/coolify-deploy
        with:
          url: ${{ vars.COOLIFY_URL }}
          token: ${{ secrets.COOLIFY_TOKEN }}
          uuid: ${{ secrets.COOLIFY_STAGING_UUID }}
          sha: ${{ github.sha }}
